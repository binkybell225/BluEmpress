name: Validate JSON data

on:
  pull_request:
    paths:
      - "data/**"
      - "scripts/**"
      - ".github/workflows/validate-json.yml"
  workflow_dispatch:

# Read-only: this workflow can never write to the repository.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the pull request (read-only, no saved credentials)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install the JSON schema validator
        run: python -m pip install --disable-pip-version-check -r scripts/requirements.txt

      - name: Validate /data against its schemas
        run: python scripts/validate_data.py
