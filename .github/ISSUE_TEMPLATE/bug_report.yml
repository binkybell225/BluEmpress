name: 🐞 Bug report
description: Something in BluEmpress crashed, froze, or looks wrong.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing! **Please do not include your email, passwords, or private details.** Everything here is public.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Tell us what you did, what you expected, and what actually happened.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open the app\n2. Tap ...\n3. ..."
  - type: input
    id: device
    attributes:
      label: Phone model
      placeholder: "e.g. Pixel 8"
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version
      placeholder: "e.g. Android 15"
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version (Play Store → BluEmpress)
      placeholder: "e.g. 8.0.0"
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots (optional)
      description: Drag images here. Crop out anything private.
  - type: checkboxes
    id: confirm
    attributes:
      label: Checks
      options:
        - label: I did not include my email, passwords, or other private information.
          required: true
