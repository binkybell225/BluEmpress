name: 💬 Feedback / review
description: Tell us what you think of BluEmpress.
title: "[Feedback] "
labels: ["feedback"]
body:
  - type: markdown
    attributes:
      value: "Honest feedback helps most. Testing is voluntary and no rewards are promised. Please keep private details out."
  - type: dropdown
    id: rating
    attributes:
      label: Overall, how is it going?
      options:
        - "Love it"
        - "Pretty good"
        - "Mixed"
        - "Needs work"
    validations:
      required: true
  - type: textarea
    id: liked
    attributes:
      label: What do you like?
  - type: textarea
    id: improve
    attributes:
      label: What would you change?
  - type: checkboxes
    id: areas
    attributes:
      label: Which areas does this cover?
      options:
        - label: Chat replies
        - label: Moods and portraits
        - label: BluRoom Check
        - label: Voice
        - label: Memory
        - label: Studio desk
        - label: Settings
        - label: Look and feel
  - type: checkboxes
    id: confirm
    attributes:
      label: Checks
      options:
        - label: I did not include my email or other private information.
          required: true
